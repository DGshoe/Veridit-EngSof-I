# Veridit — DESENVOLVIMENTO (Identity :8000, Commerce :8001)
#   docker compose up -d
# Senhas dos bancos: .env da raiz (copie de .env.example). Cada serviço tem o próprio .env
# em backend/identity/ e backend/commerce/.
# Todas as portas publicadas apenas em 127.0.0.1.

name: veridit_dev

x-postgres: &postgres
  image: postgres:16-alpine
  restart: unless-stopped
  healthcheck:
    # -h 127.0.0.1: the temporary server used during init listens only on the
    # unix socket, so the container is only "healthy" after init has finished.
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d $${APP_DB_NAME}"]
    interval: 5s
    timeout: 5s
    retries: 20
    start_period: 10s

services:
  app:
    build:
      context: ./backend/identity
      dockerfile: docker/php/Dockerfile
      target: base
    image: veridit-identity:dev
    command: ["php-fpm", "-R"]   # -R: allow workers as root (dev only, see fpm-dev.conf)
    volumes:
      - ./backend/identity:/var/www/html
      - ./backend/identity/docker/php/fpm-dev.conf:/usr/local/etc/php-fpm.d/zz-dev.conf:ro
    depends_on:
      identity-db:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Worker da fila (e-mails de recuperação de senha — REQ02)
  queue:
    build:
      context: ./backend/identity
      dockerfile: docker/php/Dockerfile
      target: base
    image: veridit-identity:dev
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=1"]
    restart: unless-stopped
    volumes:
      - ./backend/identity:/var/www/html
    depends_on:
      app:
        condition: service_started
      identity-db:
        condition: service_healthy

  web:
    image: nginx:1.30-alpine
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./backend/identity:/var/www/html:ro
      - ./backend/identity/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  # ---------------- Commerce Service (backend/commerce/) ----------------
  commerce-app:
    build:
      context: ./backend/commerce
      dockerfile: docker/php/Dockerfile
      target: base
    image: veridit-commerce:dev
    command: ["php-fpm", "-R"]   # dev only, see backend/commerce/docker/php/fpm-dev.conf
    volumes:
      - ./backend/commerce:/var/www/html
      - ./backend/commerce/docker/php/fpm-dev.conf:/usr/local/etc/php-fpm.d/zz-dev.conf:ro
    depends_on:
      commerce-db:
        condition: service_healthy

  # Worker da fila do Commerce
  commerce-queue:
    image: veridit-commerce:dev
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=1"]
    restart: unless-stopped
    volumes:
      - ./backend/commerce:/var/www/html
    depends_on:
      commerce-app:
        condition: service_started
      commerce-db:
        condition: service_healthy

  commerce-web:
    image: nginx:1.30-alpine
    ports:
      - "127.0.0.1:8001:80"
    volumes:
      - ./backend/commerce:/var/www/html:ro
      - ./backend/commerce/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - commerce-app

  identity-db:
    <<: *postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?defina POSTGRES_ADMIN_PASSWORD no .env}
      APP_DB_NAME: identity
      APP_DB_USER: identity_app
      APP_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?defina IDENTITY_DB_PASSWORD no .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - identity_db_data:/var/lib/postgresql/data

  commerce-db:
    <<: *postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?defina POSTGRES_ADMIN_PASSWORD no .env}
      APP_DB_NAME: commerce
      APP_DB_USER: commerce_app
      APP_DB_PASSWORD: ${COMMERCE_DB_PASSWORD:?defina COMMERCE_DB_PASSWORD no .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - commerce_db_data:/var/lib/postgresql/data

  evidence-db:
    <<: *postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?defina POSTGRES_ADMIN_PASSWORD no .env}
      APP_DB_NAME: evidence
      APP_DB_USER: evidence_app
      APP_DB_PASSWORD: ${EVIDENCE_DB_PASSWORD:?defina EVIDENCE_DB_PASSWORD no .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - evidence_db_data:/var/lib/postgresql/data

  notification-db:
    <<: *postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?defina POSTGRES_ADMIN_PASSWORD no .env}
      APP_DB_NAME: notification
      APP_DB_USER: notification_app
      APP_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?defina NOTIFICATION_DB_PASSWORD no .env}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - notification_db_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.33
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # interface web

volumes:
  identity_db_data:
  commerce_db_data:
  evidence_db_data:
  notification_db_data:
