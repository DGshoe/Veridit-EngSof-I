# Veridit Identity Service — DESENVOLVIMENTO
#   docker compose up -d
# Variáveis interpoladas a partir do .env (copie de .env.example).
# Todas as portas publicadas apenas em 127.0.0.1.

name: veridit_dev

x-postgres: &postgres
  image: postgres:16-alpine
  restart: unless-stopped
  healthcheck:
    # -h 127.0.0.1: the temporary server used during init listens only on the
    # unix socket, so the container is only "healthy" after init has finished.
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d $${APP_DB_NAME}"]
    interval: 5s
    timeout: 5s
    retries: 20
    start_period: 10s

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: base
    image: veridit-identity:dev
    command: ["php-fpm", "-R"]   # -R: allow workers as root (dev only, see fpm-dev.conf)
    volumes:
      - ./:/var/www/html
      - ./docker/php/fpm-dev.conf:/usr/local/etc/php-fpm.d/zz-dev.conf:ro
    depends_on:
      identity-db:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    image: nginx:1.30-alpine
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  identity-db:
    <<: *postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?defina POSTGRES_ADMIN_PASSWORD no .env}
      APP_DB_NAME: ${DB_DATABASE:-identity}
      APP_DB_USER: ${DB_USERNAME:-identity_app}
      APP_DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - identity_db_data:/var/lib/postgresql/data

  commerce-db:
    <<: *postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?defina POSTGRES_ADMIN_PASSWORD no .env}
      APP_DB_NAME: commerce
      APP_DB_USER: commerce_app
      APP_DB_PASSWORD: ${COMMERCE_DB_PASSWORD:?defina COMMERCE_DB_PASSWORD no .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - commerce_db_data:/var/lib/postgresql/data

  evidence-db:
    <<: *postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?defina POSTGRES_ADMIN_PASSWORD no .env}
      APP_DB_NAME: evidence
      APP_DB_USER: evidence_app
      APP_DB_PASSWORD: ${EVIDENCE_DB_PASSWORD:?defina EVIDENCE_DB_PASSWORD no .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - evidence_db_data:/var/lib/postgresql/data

  notification-db:
    <<: *postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?defina POSTGRES_ADMIN_PASSWORD no .env}
      APP_DB_NAME: notification
      APP_DB_USER: notification_app
      APP_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?defina NOTIFICATION_DB_PASSWORD no .env}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - notification_db_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.33
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # interface web

volumes:
  identity_db_data:
  commerce_db_data:
  evidence_db_data:
  notification_db_data:
