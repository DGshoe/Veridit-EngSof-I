; DEVELOPMENT ONLY (mounted by docker-compose.yml, never used in production).
; On Windows/macOS bind mounts every file appears as root:root, so PHP-FPM
; workers run as the same user as "docker compose exec app php artisan ..."
; to avoid permission errors on storage/ and bootstrap/cache.
; The production image runs as a non-root user (Phase 7).
[www]
user = root
group = root
